name: Practice Workflow 2

on: push

jobs:
  info-job:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Say hello
        run: echo "This is my second GitHub Actions practice"

      - name: Step 2 - Show current directory
        run: pwd

      - name: Step 3 - List files
        run: ls -la

      - name: Step 4 - Show date
        run: date

      - name: Step 5 - Show OS details
        run: uname -a
      - name: show environment variables
        run: env |head -10
      - name: show github context
        run: echo "${{ toJson(github) }}"
      - name: show runner environment
        run: echo "${{ toJson(runner) }}"
      - name: show job details
        run: echo "${{ toJson(job) }}"
      - name: show workflow details
        run: echo "${{ toJson(workflow) }}"
      - name: show steps details
        run: echo "${{ toJson(steps) }}"
      - name: show matrix details
        run: echo "${{ toJson(matrix) }}"
      - name: show secrets
        run: echo "${{ toJson(secrets) }}"
